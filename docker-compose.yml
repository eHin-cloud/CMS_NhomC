services:
  # Dịch vụ Database MySQL 8.0 chuẩn FIT-TDC
  db:
    image: mysql:8.0
    container_name: wordpressc_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cms_nhomc
    volumes:
      - db_data:/var/lib/mysql
      - ./db/cms_nhomc.sql:/docker-entrypoint-initdb.d/01_cms_nhomc.sql:ro
    ports:
      - "3308:3306"
    networks:
      - wordpressc_network

  # Dịch vụ WordPress kèm Apache phục vụ Virtual Host WordpressC.local
  wordpress:
    image: wordpress:php8.2-apache
    container_name: wordpressc_app
    restart: always
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: cms_nhomc
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: rootpassword
    volumes:
      - ./wordpress:/var/www/html
      - ./docker/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db
    networks:
      - wordpressc_network

  # Công cụ quản lý cơ sở dữ liệu qua giao diện Web (PhpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wordpressc_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - wordpressc_network

volumes:
  db_data:
    name: wordpressc_fittdc_db_data

networks:
  wordpressc_network:
    name: wordpressc_network
    driver: bridge
