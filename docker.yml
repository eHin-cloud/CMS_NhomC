# File cấu hình tương đương docker-compose.yml
# Có thể chạy bằng lệnh: docker compose up -d (tự nhận docker-compose.yml) hoặc docker compose -f docker.yml up -d
services:
  db:
    image: mariadb:10.6
    container_name: wordpressc_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cms_nhomc
    volumes:
      - db_data:/var/lib/mysql
      - ./db/cms_nhomc.sql:/docker-entrypoint-initdb.d/01_cms_nhomc.sql:ro
    ports:
      - "3308:3306"
    networks:
      - wordpressc_network

  wordpress:
    image: wordpress:php8.2-apache
    container_name: wordpressc_app
    restart: always
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: cms_nhomc
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: rootpassword
    volumes:
      - ./wordpress:/var/www/html
      - ./docker/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db
    networks:
      - wordpressc_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wordpressc_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - wordpressc_network

volumes:
  db_data:
    name: wordpressc_db_data

networks:
  wordpressc_network:
    name: wordpressc_network
    driver: bridge
