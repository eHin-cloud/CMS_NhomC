<VirtualHost *:80>
    ServerName WordpressC.local
    ServerAlias www.WordpressC.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wordpressc_error.log
    CustomLog ${APACHE_LOG_DIR}/wordpressc_access.log combined
</VirtualHost>
